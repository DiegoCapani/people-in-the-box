<!DOCTYPE html>
<head>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>AR Box Hole Fix</title>

	<script src="js/three.js"></script>

	<script src="jsartoolkit5/artoolkit.min.js"></script>
	<script src="jsartoolkit5/artoolkit.api.js"></script>

	<script src="threex/threex-artoolkitsource.js"></script>
	<script src="threex/threex-artoolkitcontext.js"></script>
	<script src="threex/threex-arbasecontrols.js"></script>
	<script src="threex/threex-armarkercontrols.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<script>

let scene, camera, renderer, clock;
let arToolkitSource, arToolkitContext;
let markerRoot1;

initialize();
animate();

function initialize() {

	scene = new THREE.Scene();

	let light = new THREE.AmbientLight(0xffffff, 1);
	scene.add(light);

	camera = new THREE.Camera();
	scene.add(camera);

	renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
	renderer.setSize(640, 480);
	renderer.setClearColor(0x000000, 0);
	document.body.appendChild(renderer.domElement);

	clock = new THREE.Clock();

	// ---------------- AR SOURCE ----------------
	arToolkitSource = new THREEx.ArToolkitSource({
		sourceType: 'webcam'
	});

	arToolkitSource.init(() => onResize());

	window.addEventListener('resize', onResize);

	function onResize() {
		arToolkitSource.onResize();
		arToolkitSource.copySizeTo(renderer.domElement);

		if (arToolkitContext.arController !== null) {
			arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
		}
	}

	// ---------------- AR CONTEXT ----------------
	arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl: 'data/camera_para.dat',
		detectionMode: 'mono'
	});

	arToolkitContext.init(() => {
		camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
	});

	// ---------------- MARKER ----------------
	markerRoot1 = new THREE.Group();
	scene.add(markerRoot1);

	new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
		type: 'pattern',
		patternUrl: "data/hiro.patt",
	});

	// ---------------- TEXTURES ----------------
	let loader = new THREE.TextureLoader();

	let wallTexture = loader.load('images/tiles.jpg');
	let floorTexture = loader.load('images/floor.jpg');

	// niente ripetizione
	floorTexture.wrapS = THREE.ClampToEdgeWrapping;
	floorTexture.wrapT = THREE.ClampToEdgeWrapping;

	// ---------------- CUBO ----------------
	let geometry = new THREE.BoxGeometry(2,2,2);

	let materials = [

		new THREE.MeshLambertMaterial({ map: wallTexture }),
		new THREE.MeshLambertMaterial({ map: wallTexture }),
		new THREE.MeshLambertMaterial({ map: wallTexture }),
		new THREE.MeshLambertMaterial({ map: floorTexture }),
		new THREE.MeshLambertMaterial({ map: wallTexture }),
		new THREE.MeshLambertMaterial({ map: wallTexture })

	];

	let cube = new THREE.Mesh(geometry, materials);
	cube.position.y = -1;
	markerRoot1.add(cube);

	// ---------------- HOLE (IMPORTANTE) ----------------

	let holeGeometry = new THREE.PlaneGeometry(25, 25);

	let holeMaterial = new THREE.MeshBasicMaterial({
		colorWrite: false,
		depthWrite: false
	});

	let hole = new THREE.Mesh(holeGeometry, holeMaterial);

	hole.rotation.x = -Math.PI / 2;

	// leggero offset per evitare conflitto
	hole.position.y = -1.01;

	markerRoot1.add(hole);
}

function update() {
	if (arToolkitSource.ready !== false)
		arToolkitContext.update(arToolkitSource.domElement);
}

function animate() {
	requestAnimationFrame(animate);
	update();
	renderer.render(scene, camera);
}

</script>

</body>
</html>
