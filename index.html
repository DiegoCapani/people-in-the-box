<!DOCTYPE html>
<head>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>AR Box</title>

	<script src="js/three.js"></script>

	<script src="jsartoolkit5/artoolkit.min.js"></script>
	<script src="jsartoolkit5/artoolkit.api.js"></script>

	<script src="threex/threex-artoolkitsource.js"></script>
	<script src="threex/threex-artoolkitcontext.js"></script>
	<script src="threex/threex-arbasecontrols.js"></script>
	<script src="threex/threex-armarkercontrols.js"></script>
</head>

<body style="margin:0; overflow:hidden; font-family:Monospace;">

<script>

let scene, camera, renderer, clock;
let arToolkitSource, arToolkitContext;
let markerRoot1;

initialize();
animate();

function initialize() {

	scene = new THREE.Scene();

	let light = new THREE.AmbientLight(0xffffff, 1);
	scene.add(light);

	camera = new THREE.Camera();
	scene.add(camera);

	renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
	renderer.setSize(640, 480);
	renderer.setClearColor(new THREE.Color('lightgrey'), 0);
	document.body.appendChild(renderer.domElement);

	clock = new THREE.Clock();

	// ---------------- AR SOURCE ----------------
	arToolkitSource = new THREEx.ArToolkitSource({ sourceType:'webcam' });

	arToolkitSource.init(function() {
		onResize();
	});

	window.addEventListener('resize', function() {
		onResize();
	});

	function onResize() {
		arToolkitSource.onResize();
		arToolkitSource.copySizeTo(renderer.domElement);
		if (arToolkitContext.arController !== null) {
			arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
		}
	}

	// ---------------- AR CONTEXT ----------------
	arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl: 'data/camera_para.dat',
		detectionMode: 'mono'
	});

	arToolkitContext.init(function() {
		camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
	});

	// ---------------- MARKER ----------------
	markerRoot1 = new THREE.Group();
	scene.add(markerRoot1);

	new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
		type: 'pattern',
		patternUrl: "data/hiro.patt",
	});

	// ---------------- BOX GEOMETRY ----------------

	let geometry = new THREE.BoxGeometry(2,2,2);

	let loader = new THREE.TextureLoader();

	let wallTexture = loader.load('images/tiles.jpg');
	let floorTexture = loader.load('images/floor.jpg');

	// migliora ripetizione pavimento
	floorTexture.wrapS = THREE.RepeatWrapping;
	floorTexture.wrapT = THREE.RepeatWrapping;
	floorTexture.repeat.set(4,4);

	let materials = [

		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }), // +X
		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }), // -X
		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }), // +Y
		new THREE.MeshLambertMaterial({ map: floorTexture, side: THREE.BackSide }), // -Y (fondo)
		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }), // +Z
		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide })  // -Z

	];

	let mesh1 = new THREE.Mesh(geometry, materials);
	mesh1.position.y = -1;
	markerRoot1.add(mesh1);

	// ---------------- HOLE CLOAK (INVISIBILITY PLANE) ----------------

	let geometry0 = new THREE.PlaneGeometry(18,18,9,9);

	// crea il buco (versione AR.js classica)
	geometry0.faces.splice(80,2);
	geometry0.faceVertexUvs[0].splice(80,2);

	let material0 = new THREE.MeshBasicMaterial({
		colorWrite: false
	});

	let mesh0 = new THREE.Mesh(geometry0, material0);
	mesh0.rotation.x = -Math.PI/2;

	markerRoot1.add(mesh0);
}

function update() {
	if (arToolkitSource.ready !== false)
		arToolkitContext.update(arToolkitSource.domElement);
}

function render() {
	renderer.render(scene, camera);
}

function animate() {
	requestAnimationFrame(animate);
	update();
	render();
}

</script>

</body>
</html>
