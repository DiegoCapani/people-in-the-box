<!DOCTYPE html>
<head>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>AR Hole Stable</title>

	<script src='js/three.js'></script>
	<script src="jsartoolkit5/artoolkit.min.js"></script>
	<script src="jsartoolkit5/artoolkit.api.js"></script>
	<script src="threex/threex-artoolkitsource.js"></script>
	<script src="threex/threex-artoolkitcontext.js"></script>
	<script src="threex/threex-arbasecontrols.js"></script>
	<script src="threex/threex-armarkercontrols.js"></script>
</head>

<body style='margin:0; overflow:hidden;'>

<script>

let scene, camera, renderer, clock;
let arToolkitSource, arToolkitContext;
let markerRoot1;
let mesh1;

init();
animate();

function init(){

	// ---------------- SCENE ----------------
	scene = new THREE.Scene();

	camera = new THREE.Camera();
	scene.add(camera);

	// ---------------- RENDERER (STENCIL ON) ----------------
	renderer = new THREE.WebGLRenderer({
		antialias:true,
		alpha:true,
		stencil:true
	});

	renderer.setSize(640,480);
	document.body.appendChild(renderer.domElement);

	clock = new THREE.Clock();

	// ---------------- LIGHT ----------------
	scene.add(new THREE.AmbientLight(0xcccccc,1));

	// ---------------- AR SOURCE ----------------
	arToolkitSource = new THREEx.ArToolkitSource({ sourceType:'webcam' });

	arToolkitSource.init(function(){
		onResize();
	});

	window.addEventListener('resize', onResize);

	function onResize(){
		arToolkitSource.onResize();
		arToolkitSource.copySizeTo(renderer.domElement);
		if(arToolkitContext.arController){
			arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
		}
	}

	// ---------------- AR CONTEXT ----------------
	arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl:'data/camera_para.dat',
		detectionMode:'mono'
	});

	arToolkitContext.init(function(){
		camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
	});

	// ---------------- MARKER ----------------
	markerRoot1 = new THREE.Group();
	scene.add(markerRoot1);

	new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
		type:'pattern',
		patternUrl:'data/hiro.patt'
	});

	// ---------------- TEXTURES ----------------
	let loader = new THREE.TextureLoader();

	let wallTexture = loader.load('images/tiles.jpg', render);
	let floorTexture = loader.load('images/floor.jpg', render);

	// niente ripetizione
	floorTexture.wrapS = THREE.ClampToEdgeWrapping;
	floorTexture.wrapT = THREE.ClampToEdgeWrapping;

	// ---------------- STENCIL HELPERS ----------------
	function stencilMaterial(mat){

		mat.stencilWrite = true;
		mat.stencilRef = 1;
		mat.stencilFunc = THREE.EqualStencilFunc;
		mat.stencilFail = THREE.KeepStencilOp;
		mat.stencilZFail = THREE.KeepStencilOp;
		mat.stencilZPass = THREE.KeepStencilOp;

		return mat;
	}

	// ---------------- HOLE PLANE (WRITES STENCIL) ----------------
	let planeGeo = new THREE.PlaneGeometry(18,18);

	let planeMat = new THREE.MeshBasicMaterial({
		colorWrite:false,
		stencilWrite:true,
		stencilRef:1,
		stencilFunc:THREE.AlwaysStencilFunc,
		stencilFail:THREE.ReplaceStencilOp,
		stencilZFail:THREE.ReplaceStencilOp,
		stencilZPass:THREE.ReplaceStencilOp
	});

	let hole = new THREE.Mesh(planeGeo, planeMat);
	hole.rotation.x = -Math.PI/2;
	markerRoot1.add(hole);

	// ---------------- CUBE ----------------
	let geo = new THREE.BoxGeometry(2,2,2);

	let mats = [

		stencilMaterial(new THREE.MeshLambertMaterial({ map:wallTexture })),
		stencilMaterial(new THREE.MeshLambertMaterial({ map:wallTexture })),
		stencilMaterial(new THREE.MeshLambertMaterial({ map:wallTexture })),

		// 🔥 pavimento diverso
		stencilMaterial(new THREE.MeshLambertMaterial({ map:floorTexture })),

		stencilMaterial(new THREE.MeshLambertMaterial({ map:wallTexture })),
		stencilMaterial(new THREE.MeshLambertMaterial({ map:wallTexture }))
	];

	mesh1 = new THREE.Mesh(geo, mats);
	mesh1.position.y = -1;

	markerRoot1.add(mesh1);
}

function update(){
	if(arToolkitSource.ready)
		arToolkitContext.update(arToolkitSource.domElement);
}

function render(){
	renderer.render(scene,camera);
}

function animate(){
	requestAnimationFrame(animate);
	update();
	render();
}

</script>

</body>
</html>
