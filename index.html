<!DOCTYPE html>
<head>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>Hello, world!</title>

	<script src='js/three.js'></script>
	<script src="jsartoolkit5/artoolkit.min.js"></script>
	<script src="jsartoolkit5/artoolkit.api.js"></script>
	<script src="threex/threex-artoolkitsource.js"></script>
	<script src="threex/threex-artoolkitcontext.js"></script>
	<script src="threex/threex-arbasecontrols.js"></script>
	<script src="threex/threex-armarkercontrols.js"></script>
</head>

<body style='margin:0; overflow:hidden; font-family:Monospace;'>

<script>

var scene, camera, renderer, clock, deltaTime, totalTime;
var arToolkitSource, arToolkitContext;
var markerRoot1;
var mesh1;

initialize();
animate();

function initialize()
{
	scene = new THREE.Scene();

	let ambientLight = new THREE.AmbientLight(0xcccccc, 1.0);
	scene.add(ambientLight);

	camera = new THREE.Camera();
	scene.add(camera);

	renderer = new THREE.WebGLRenderer({
		antialias:true,
		alpha:true
	});

	renderer.setClearColor(new THREE.Color('lightgrey'), 0);
	renderer.setSize(640,480);

	renderer.domElement.style.position = 'absolute';
	renderer.domElement.style.top = '0px';
	renderer.domElement.style.left = '0px';

	document.body.appendChild(renderer.domElement);

	clock = new THREE.Clock();

	// ---------------- AR SOURCE ----------------
	arToolkitSource = new THREEx.ArToolkitSource({
		sourceType:'webcam'
	});

	arToolkitSource.init(function(){
		onResize();
	});

	window.addEventListener('resize', onResize);

	function onResize(){
		arToolkitSource.onResize();
		arToolkitSource.copySizeTo(renderer.domElement);

		if(arToolkitContext.arController !== null){
			arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
		}
	}

	// ---------------- AR CONTEXT ----------------
	arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl:'data/camera_para.dat',
		detectionMode:'mono'
	});

	arToolkitContext.init(function(){
		camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
	});

	// ---------------- MARKER ----------------
	markerRoot1 = new THREE.Group();
	scene.add(markerRoot1);

	new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
		type:'pattern',
		patternUrl:'data/hiro.patt'
	});

	// ---------------- TEXTURE ----------------
	let loader = new THREE.TextureLoader();

	let wallTexture = loader.load('images/tiles.jpg', render);
	let floorTexture = loader.load('images/floor.jpg', render);

	// niente ripetizione pavimento
	floorTexture.wrapS = THREE.ClampToEdgeWrapping;
	floorTexture.wrapT = THREE.ClampToEdgeWrapping;

	// ---------------- CUBO ----------------
	let geometry1 = new THREE.CubeGeometry(2,2,2);

	let materials = [

		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }),
		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }),
		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }),

		// 🔥 pavimento interno diverso
		new THREE.MeshLambertMaterial({ map: floorTexture, side: THREE.BackSide }),

		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide }),
		new THREE.MeshLambertMaterial({ map: wallTexture, side: THREE.BackSide })

	];

	mesh1 = new THREE.Mesh(geometry1, materials);
	mesh1.position.y = -1;

	markerRoot1.add(mesh1);

	// ---------------- BUCO (INVARIATO) ----------------
	let geometry0 = new THREE.PlaneGeometry(18,18,9,9);

	geometry0.faces.splice(80,2);
	geometry0.faceVertexUvs[0].splice(80,2);

	let material0 = new THREE.MeshBasicMaterial({
		colorWrite:false
	});

	let mesh0 = new THREE.Mesh(geometry0, material0);
	mesh0.rotation.x = -Math.PI/2;

	markerRoot1.add(mesh0);
}

function update()
{
	if(arToolkitSource.ready !== false)
		arToolkitContext.update(arToolkitSource.domElement);
}

function animate()
{
	requestAnimationFrame(animate);
	update();
	renderer.render(scene,camera);
}

</script>

</body>
</html>
