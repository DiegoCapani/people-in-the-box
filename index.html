<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR DEBUG</title>

<script src="js/three.js"></script>
<script src="jsartoolkit5/artoolkit.min.js"></script>
<script src="jsartoolkit5/artoolkit.api.js"></script>
<script src="threex/threex-artoolkitsource.js"></script>
<script src="threex/threex-artoolkitcontext.js"></script>
<script src="threex/threex-arbasecontrols.js"></script>
<script src="threex/threex-armarkercontrols.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<script>

let scene, camera, renderer;
let arToolkitSource, arToolkitContext;
let markerRoot;

init();
animate();

function init() {

	scene = new THREE.Scene();

	camera = new THREE.Camera();
	scene.add(camera);

	renderer = new THREE.WebGLRenderer({ alpha:true });
	renderer.setSize(640,480);
	document.body.appendChild(renderer.domElement);

	// LIGHT
	scene.add(new THREE.AmbientLight(0xffffff,1));

	// ---------------- CAMERA ----------------
	arToolkitSource = new THREEx.ArToolkitSource({
		sourceType: 'webcam'
	});

	arToolkitSource.init(function(){
		setTimeout(onResize, 1000);
	});

	window.addEventListener('resize', onResize);

	function onResize(){
		arToolkitSource.onResize();
		arToolkitSource.copySizeTo(renderer.domElement);
	}

	// ---------------- CONTEXT ----------------
	arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl:'data/camera_para.dat',
		detectionMode:'mono'
	});

	arToolkitContext.init(function(){
		camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
	});

	// ---------------- MARKER ----------------
	markerRoot = new THREE.Group();
	scene.add(markerRoot);

	new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
		type:'pattern',
		patternUrl:'data/hiro.patt'
	});

	// ---------------- CUBO TEST ----------------
	let geometry = new THREE.BoxGeometry(2,2,2);

	let loader = new THREE.TextureLoader();

	let wall = loader.load('images/tiles.jpg');
	let floor = loader.load('images/floor.jpg');

	floor.wrapS = THREE.ClampToEdgeWrapping;
	floor.wrapT = THREE.ClampToEdgeWrapping;

	let materials = [
		new THREE.MeshBasicMaterial({ map: wall }),
		new THREE.MeshBasicMaterial({ map: wall }),
		new THREE.MeshBasicMaterial({ map: wall }),
		new THREE.MeshBasicMaterial({ map: floor }),
		new THREE.MeshBasicMaterial({ map: wall }),
		new THREE.MeshBasicMaterial({ map: wall })
	];

	let cube = new THREE.Mesh(geometry, materials);
	cube.position.y = -1;
	markerRoot.add(cube);

	// ---------------- BUCO ----------------
	let holeGeo = new THREE.PlaneGeometry(20,20);

	let holeMat = new THREE.MeshBasicMaterial({
		colorWrite:false,
		depthWrite:false
	});

	let hole = new THREE.Mesh(holeGeo, holeMat);
	hole.rotation.x = -Math.PI/2;
	hole.position.y = -1.01;

	markerRoot.add(hole);
}

function animate(){
	requestAnimationFrame(animate);

	if(arToolkitSource && arToolkitSource.ready){
		arToolkitContext.update(arToolkitSource.domElement);
	}

	renderer.render(scene,camera);
}

</script>

</body>
</html>
